<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Music Player</h1>
    <label class="theme-switch" title="Switch between light and dark mode">
      <input type="checkbox" id="theme-toggle" role="switch" aria-label="Dark mode" checked>
      <span class="track">
        <svg class="ico sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <svg class="ico moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <span class="thumb"></span>
      </span>
    </label>
  </header>

  <main class="container">
    <section class="panel library" aria-label="All songs">
      <div class="lib-head"><h2>All songs</h2><button id="sync-btn" title="Check your Spotify playlist for new songs">Sync playlist</button></div>
      <input type="search" id="song-search" placeholder="Search your songs" aria-label="Search songs">
      <div class="chips" id="genre-chips" role="group" aria-label="Filter by genre"></div>
      <div class="scroll">
        <div id="songs-list" class="list"></div>
        
      </div>
    </section>

    <section class="player" aria-label="Now playing">
      <div class="card">
        <div class="art-wrap"><img id="card-img" alt="Album cover"></div>
        <h3 id="card-title">Select a song</h3>
        <p id="card-artist"></p>
        <div class="controls">
          <button id="shuffle-btn" class="icon-btn" aria-pressed="false" title="Shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="prev-btn" class="icon-btn" title="Previous song" aria-label="Previous song">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
          </button>
          <button id="play-btn" class="icon-btn play" title="Play or pause (Space)" aria-label="Play or pause">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button id="next-btn" class="icon-btn" title="Next song" aria-label="Next song">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
          </button>
          <button id="repeat-btn" class="icon-btn" data-mode="off" aria-pressed="false" title="Repeat: off" aria-label="Repeat: off">
            <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="actions">
          <button id="add-to-playlist-btn">Add to playlist</button>
        </div>
        <div id="embed-wrap" class="embed-wrap"></div>
        <p id="status" class="status" role="status"></p>
      </div>
    </section>

    <section class="panel playlists" aria-label="Playlists">
      <div class="create-row">
        <input type="text" id="playlist-name-input" placeholder="New playlist name" aria-label="Playlist name">
        <button id="create-btn">Create</button>
      </div>
      <input type="search" id="playlist-search" placeholder="Search playlists" aria-label="Search playlists">

      <div class="scroll">
      <h2>Current playlist</h2>
      <div id="current-playlist-songs" class="list"></div>

      <h2>All playlists</h2>
      <div id="all-playlists-list" class="list"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
